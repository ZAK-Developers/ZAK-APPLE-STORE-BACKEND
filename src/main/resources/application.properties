spring.application.name=zak-apple-store
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zak_apple_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.separator=@@

# JWT
app.jwt.secret=${JWT_SECRET:ZakAppleStoreJwtSecretKeyMustBeAtLeast32CharactersLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OTP
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# OAuth2 redirect after Google login (frontend callback URL)
app.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/callback}

# Google OAuth2 (replace with real values in environment)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:zak@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tlct34}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Bootstrap admin
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@zakapplestore.com}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
