spring.application.name=ZAKAppleStore
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ZAKapplestoreDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:ZakAppleStoreSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForSecurity}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
